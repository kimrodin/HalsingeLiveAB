# Standalone stack: no .env or development volumes; only RabbitMQ's local UI is published.
x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  InitializeDatabase: "true"
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: loadtest
  RabbitMq__Password: loadtest
  TicketService__InternalApiKey: loadtest-only
  Logging__LogLevel__Default: Warning
  Logging__LogLevel__Microsoft.AspNetCore: Warning

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/health/ready"]
  interval: 2s
  timeout: 6s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: postgres:18-alpine
    # Four service pools of 20 use at most 80 of these 100 slots.
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
      - ./fixture.sql:/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d loadtest"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1::15672" # Docker chooses a free local port for each run.
    environment:
      RABBITMQ_DEFAULT_USER: loadtest
      RABBITMQ_DEFAULT_PASS: loadtest
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 10s
      retries: 30

  eventcatalog:
    image: halsingelive-load-eventcatalog:local
    build:
      context: ../../src/services/EventCatalog
    environment:
      <<: *app-environment
      ConnectionStrings__EventCatalog: Host=postgres;Database=eventcatalog;Username=loadtest;Password=loadtest;Maximum Pool Size=20;Application Name=load-eventcatalog
      Booking__BaseUrl: http://booking:8080
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy

  payment-simulator:
    image: halsingelive-load-payment-simulator:local
    build:
      context: ../../src
      dockerfile: services/PaymentSimulator/Dockerfile
    environment:
      <<: *app-environment
      ConnectionStrings__PaymentSimulator: Host=postgres;Database=payments;Username=loadtest;Password=loadtest;Maximum Pool Size=20;Application Name=load-payments
      PaymentSimulation__Outcome: Succeeded
      PaymentSimulation__DelayMs: "500"
      PaymentSimulation__TimeoutMs: "5000"
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticketservice:
    image: halsingelive-load-ticketservice:local
    build:
      context: ../../src
      dockerfile: services/TicketService/Dockerfile
    environment:
      <<: *app-environment
      ConnectionStrings__TicketService: Host=postgres;Database=tickets;Username=loadtest;Password=loadtest;Maximum Pool Size=20;Application Name=load-tickets
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking:
    image: halsingelive-load-booking:local
    build:
      context: ../../src
      dockerfile: services/Booking/Dockerfile
    environment:
      <<: *app-environment
      ConnectionStrings__Booking: Host=postgres;Database=booking;Username=loadtest;Password=loadtest;Maximum Pool Size=20;Application Name=load-booking
      ConnectionStrings__Redis: redis:6379
      EventCatalog__BaseUrl: http://eventcatalog:8080
      PaymentSimulator__BaseUrl: http://payment-simulator:8080
      TicketService__BaseUrl: http://ticketservice:8080
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eventcatalog:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
      ticketservice:
        condition: service_healthy

  api-gateway:
    image: halsingelive-load-api-gateway:local
    build:
      context: ../../src/ApiGateway
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__Clusters__eventCatalog__Destinations__primary__Address: http://eventcatalog:8080
      ReverseProxy__Clusters__booking__Destinations__primary__Address: http://booking:8080
      ReverseProxy__Clusters__ticketService__Destinations__primary__Address: http://ticketservice:8080
      ReverseProxy__Clusters__paymentSimulator__Destinations__primary__Address: http://payment-simulator:8080
      Logging__LogLevel__Default: Warning
    depends_on:
      booking:
        condition: service_healthy

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    volumes:
      - ./checkout.js:/scripts/checkout.js:ro
    # The runner mounts a separate results directory for each run.
