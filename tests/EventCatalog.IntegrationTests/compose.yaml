services:
  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["test"]
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    environment:
      EVENTCATALOG_TEST_POSTGRES: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: dotnet test tests/EventCatalog.IntegrationTests/EventCatalog.IntegrationTests.csproj --artifacts-path /tmp/eventcatalog-artifacts
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55486:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
