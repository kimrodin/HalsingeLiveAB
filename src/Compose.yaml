# Keep existing local database and Keycloak volumes after moving this file.
name: services

services:

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__Clusters__eventCatalog__Destinations__primary__Address: http://eventcatalog:8080/
      ReverseProxy__Clusters__booking__Destinations__primary__Address: http://booking:8080/
      ReverseProxy__Clusters__ticketService__Destinations__primary__Address: http://ticketservice:8080/
      ReverseProxy__Clusters__paymentSimulator__Destinations__primary__Address: http://payment-simulator:8080/
    ports:
      - "127.0.0.1:5212:8080"
    depends_on:
      - eventcatalog
      - booking
      - ticketservice
      - payment-simulator

  booking:
    build:
      context: .
      dockerfile: services/Booking/Dockerfile
    environment:
      ConnectionStrings__Booking: "Host=booking-db;Port=5432;Database=booking_dev;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "booking-redis:6379"
      EventCatalog__BaseUrl: "http://eventcatalog:8080/"
      PaymentSimulator__BaseUrl: "http://payment-simulator:8080/"
      PaymentSimulator__TimeoutSeconds: "5"
      EventCatalog__TimeoutSeconds: "5"
      TicketService__BaseUrl: "http://ticketservice:8080/"
      TicketService__TimeoutSeconds: "5"
      TicketService__InternalApiKey: "${TICKET_SERVICE_INTERNAL_API_KEY:?Set TICKET_SERVICE_INTERNAL_API_KEY}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
      Authentication__Authority: http://localhost:8180/realms/halsingelive
      Authentication__MetadataAddress: http://keycloak:8080/realms/halsingelive/.well-known/openid-configuration
      ASPNETCORE_ENVIRONMENT: Development
      InitializeDatabase: "true"
    healthcheck: &api-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
    depends_on:
      booking-db:
        condition: service_healthy
      booking-redis:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
      ticketservice:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticketservice:
    build:
      context: .
      dockerfile: services/TicketService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      InitializeDatabase: "true"
      TicketService__InternalApiKey: "${TICKET_SERVICE_INTERNAL_API_KEY:?Set TICKET_SERVICE_INTERNAL_API_KEY}"
      Authentication__Authority: http://localhost:8180/realms/halsingelive
      Authentication__MetadataAddress: http://keycloak:8080/realms/halsingelive/.well-known/openid-configuration
      ConnectionStrings__TicketService: "Host=ticketservice-db;Port=5432;Database=ticketservice_dev;Username=postgres;Password=postgres"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    healthcheck: *api-healthcheck
    depends_on:
      ticketservice-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticketservice-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ticketservice_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ticketservice-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketservice_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booking_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - booking-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  eventcatalog:
    build:
      context: ./services/EventCatalog
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__EventCatalog: "Host=eventcatalog-db;Port=5432;Database=eventcatalog_dev;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      InitializeDatabase: "true"
      Booking__BaseUrl: "http://booking:8080/"
      Booking__TimeoutSeconds: "5"
      Authentication__Authority: http://localhost:8180/realms/halsingelive
      Authentication__MetadataAddress: http://keycloak:8080/realms/halsingelive/.well-known/openid-configuration
      VenueMapStorage__RootPath: /app/uploads/venue-maps
      EventImageStorage__RootPath: /app/uploads/event-images
    healthcheck: *api-healthcheck
    volumes:
      - venue-maps-data:/app/uploads/venue-maps
      - event-images-data:/app/uploads/event-images
    depends_on:
      eventcatalog-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      booking:
        condition: service_healthy

  eventcatalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eventcatalog_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eventcatalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventcatalog_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  booking-redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    volumes:
      - booking-redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-simulator-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payment_simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - payment-simulator-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-simulator:
    build:
      context: .
      dockerfile: services/PaymentSimulator/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Authority: http://localhost:8180/realms/halsingelive
      Authentication__MetadataAddress: http://keycloak:8080/realms/halsingelive/.well-known/openid-configuration
      ConnectionStrings__PaymentSimulator: "Host=payment-simulator-db;Port=5432;Database=payment_simulator;Username=postgres;Password=postgres"
      PaymentSimulation__Outcome: "${PAYMENT_SIMULATION_OUTCOME:-Succeeded}"
      PaymentSimulation__DelayMs: "${PAYMENT_SIMULATION_DELAY_MS:-500}"
      PaymentSimulation__TimeoutMs: "${PAYMENT_SIMULATION_TIMEOUT_MS:-5000}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    healthcheck: *api-healthcheck
    depends_on:
      payment-simulator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  admin-web:
    build:
      context: ./frontend/admin-web
      dockerfile: Dockerfile
    environment:
      API_GATEWAY_PROXY_TARGET: http://api-gateway:8080
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  customer-web:
    build:
      context: ./frontend/customer-web
      dockerfile: Dockerfile
    environment:
      API_GATEWAY_PROXY_TARGET: http://api-gateway:8080
    ports:
      - "5174:80"
    depends_on:
      - api-gateway

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../infrastructure/keycloak:/opt/keycloak/data/import:ro

volumes:
  booking-data:
  keycloak-data:
  eventcatalog-data:
  payment-simulator-data:
  event-images-data:
  venue-maps-data:
  booking-redis-data:
  rabbitmq-data:
  ticketservice-data:
