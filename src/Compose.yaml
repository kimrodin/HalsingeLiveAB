services:

  booking:
    build:
      context: ./Services/Booking
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Booking: "Host=booking-db;Port=5432;Database=booking_dev;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "booking-redis:6379"
      ASPNETCORE_ENVIRONMENT: Development
      InitializeDatabase: "true"
    ports:
      - "8081:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      booking-redis:
        condition: service_started

  booking-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booking_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - booking-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  eventcatalog:
    build:
      context: ./Services/EventCatalog
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__EventCatalog: "Host=eventcatalog-db;Port=5432;Database=eventcatalog_dev;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      VenueMapStorage__RootPath: /app/uploads/venue-maps
    ports:
      - "8080:8080"
    volumes:
      - venue-maps-data:/app/uploads/venue-maps
    depends_on:
      eventcatalog-db:
        condition: service_healthy

  eventcatalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eventcatalog_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eventcatalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventcatalog_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  booking-redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    volumes:
      - booking-redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: eventcatalog:8080
    ports:
      - "5173:80"
    depends_on:
      - eventcatalog

volumes:
  booking-data:
  eventcatalog-data:
  venue-maps-data:
  booking-redis-data:
