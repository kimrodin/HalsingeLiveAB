services:

  eventcatalog:
    build:
      context: ./EventCatalog
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      eventcatalog-db:
        condition: service_healthy

  eventcatalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eventcatalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eventcatalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventcatalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventcatalog-data:
