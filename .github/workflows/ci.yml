name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: payment-tests
          RABBITMQ_DEFAULT_PASS: payment-tests
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVENTCATALOG_TEST_POSTGRES: Host=localhost;Port=5434;Database=postgres;Username=postgres;Password=postgres
      PAYMENT_TEST_DB: Host=localhost;Port=5434;Database=postgres;Username=postgres;Password=postgres
      PAYMENT_TEST_RABBITMQ: amqp://payment-tests:payment-tests@localhost:5672/
      BOOKING_TEST_POSTGRES: Host=localhost;Port=5434;Database=postgres;Username=postgres;Password=postgres
      BOOKING_TEST_REDIS: localhost:6379
      TICKET_TEST_POSTGRES: Host=localhost;Port=5434;Database=postgres;Username=postgres;Password=postgres
      TICKET_TEST_RABBITMQ: amqp://payment-tests:payment-tests@localhost:5672/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HalsingeLiveAB.sln

      - name: Build
        run: dotnet build HalsingeLiveAB.sln --configuration Release --no-restore

      - name: Test
        # Messaging suites share fixed queues on this broker; run projects sequentially.
        run: dotnet test HalsingeLiveAB.sln --configuration Release --no-build --no-restore --maxcpucount:1

  frontend:
    name: Frontend checks (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, customer-web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: src/frontend/${{ matrix.app }}
        run: npm run lint

      - name: Test HTTP error handling
        if: matrix.app == 'customer-web'
        working-directory: src/frontend/${{ matrix.app }}
        run: npm test

      - name: Build
        working-directory: src/frontend/${{ matrix.app }}
        run: npm run build

      - name: Verify Vite client headers
        # This test starts the actual Vite configuration for both applications.
        if: matrix.app == 'customer-web'
        run: |
          npm ci --prefix src/frontend/admin-web
          node --test tests/proxy-chain/vite.test.mjs

  containers:
    name: Container build and Compose validation
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate development Compose structure
        run: docker compose -f src/Compose.yaml -f src/Compose.dev.yaml config --no-interpolate --no-normalize --quiet

      - name: Build Booking image
        run: docker build -f src/services/Booking/Dockerfile src

      - name: Verify Keycloak login protection
        shell: pwsh
        run: ./tests/keycloak-security/run.ps1

      - name: Save Keycloak test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-security-diagnostics
          path: tests/keycloak-security/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Nginx and gateway client address chain
        run: docker compose -p halsingelive-proxy-tests -f tests/proxy-chain/compose.yaml up --build --abort-on-container-exit --exit-code-from client

      - name: Stop proxy test containers
        if: always()
        run: docker compose -p halsingelive-proxy-tests -f tests/proxy-chain/compose.yaml down

      - name: Build EventCatalog image
        run: docker build -f src/services/EventCatalog/Dockerfile src/services/EventCatalog

      - name: Verify real reservation proxy chain
        # The runner always tears down its uniquely named project.
        shell: pwsh
        run: ./tests/reservation-chain/run.ps1

      - name: Save reservation chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reservation-chain-evidence
          path: tests/reservation-chain/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build PaymentSimulator image
        run: docker build -f src/services/PaymentSimulator/Dockerfile src

      - name: Build TicketService image
        run: docker build -f src/services/TicketService/Dockerfile src
