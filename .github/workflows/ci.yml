name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYMENT_TEST_DB: Host=localhost;Port=5434;Database=postgres;Username=postgres;Password=postgres
      BOOKING_TEST_POSTGRES: Host=localhost;Port=5434;Database=postgres;Username=postgres;Password=postgres
      BOOKING_TEST_REDIS: localhost:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HalsingeLiveAB.sln

      - name: Build
        run: dotnet build HalsingeLiveAB.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HalsingeLiveAB.sln --configuration Release --no-build --no-restore

  frontend:
    name: Frontend checks (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, customer-web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: src/frontend/${{ matrix.app }}
        run: npm run lint

      - name: Build
        working-directory: src/frontend/${{ matrix.app }}
        run: npm run build

  containers:
    name: Container build and Compose validation
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    timeout-minutes: 30
    env:
      TICKET_SERVICE_INTERNAL_API_KEY: ci-only-not-a-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate development Compose configuration
        run: docker compose -f src/Compose.yaml -f src/Compose.dev.yaml config --quiet

      - name: Build Booking image
        run: docker build -f src/services/Booking/Dockerfile src/services/Booking

      - name: Build EventCatalog image
        run: docker build -f src/services/EventCatalog/Dockerfile src/services/EventCatalog

      - name: Build PaymentSimulator image
        run: docker build -f src/services/PaymentSimulator/Dockerfile src/services/PaymentSimulator

      - name: Build TicketService image
        run: docker build -f src/services/TicketService/Dockerfile src/services/TicketService
