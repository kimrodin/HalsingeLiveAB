name: Deploy Customer Website

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/customer-web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/customer-web/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend/customer-web
        run: npm ci

      - name: Build website
        working-directory: src/frontend/customer-web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/customer-web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
